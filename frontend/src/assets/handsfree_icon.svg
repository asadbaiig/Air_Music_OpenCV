<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="hf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="hf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1ed760" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="50" cy="50" r="47" fill="#070a0e" stroke="url(#hf-grad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43" fill="url(#hf-glow)" />

  <!-- Outer Acoustic Sound Waves / Rings -->
  <path d="M 22 50 A 28 28 0 0 1 78 50" stroke="url(#hf-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.45" stroke-dasharray="2 6" />
  <path d="M 14 50 A 36 36 0 0 1 86 50" stroke="url(#hf-grad)" stroke-width="2" stroke-linecap="round" opacity="0.25" />

  <!-- Stylized Gesture Hand Silhouette -->
  <g filter="url(#hf-shadow)">
    <path d="M 33 66 C 33 55 35 44 35 34 C 35 32 37 30.5 39 30.5 C 41 30.5 43 32 43 34 L 43 45 C 43 40 44 26 46 24 C 47.5 22.5 50.5 22.5 52 24 C 53.5 25.5 53.5 30 53.5 44 C 54.5 36 56 28 58 28 C 60 28 61.5 29.5 61.5 32 L 61.5 48 C 62.5 43 64.5 37 66.5 37 C 68.5 37 70 38.5 70 41 L 69 57 C 68 67 60 76 48 76 C 41 76 34 71 33 66 Z M 33 56 C 30 54 26 53 25 55 C 24 57 26 60 30 62"
          fill="none" 
          stroke="url(#hf-grad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Audio Pulse Dots -->
  <circle cx="50" cy="14" r="2.5" fill="#00f2fe" />
  <circle cx="30" cy="19" r="2" fill="#1ed760" opacity="0.8" />
  <circle cx="70" cy="19" r="2" fill="#1ed760" opacity="0.8" />
</svg>
